name: Deploy

# `v2-movie-hunt` is the source of truth and the only branch Cloudflare serves.
# Other branches are still built and tested on push — see the `deploy` job's
# condition for why they stop there.
on:
  push:
    branches: [v2-movie-hunt, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: verify
    # Production deploys come from one branch and one branch only.
    #
    # Pages keeps branches apart on its own — a push to another branch would
    # land as a preview. The Worker does not: `wrangler deploy` is not
    # branch-aware, so it always replaces the live `campus-movie-hunt-api`, and
    # the migration step above it runs `--remote` against the one production
    # database. Any branch reaching this job could therefore overwrite the API
    # and migrate the real data while Pages looked reassuringly separate.
    #
    # Everything above still runs everywhere: another branch gets lint,
    # typecheck and the full test suite, and simply stops here.
    if: github.ref == 'refs/heads/v2-movie-hunt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply campus_movie_hunt --remote

      - name: Deploy Worker
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Build client against the deployed API
        env:
          VITE_API_BASE: ${{ steps.worker.outputs.deployment-url || vars.VITE_API_BASE }}
        run: |
          test -n "$VITE_API_BASE" || { echo "::error::No API URL — set the VITE_API_BASE repo variable"; exit 1; }
          echo "API base: $VITE_API_BASE"
          npm run build --workspace client

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name campus-movie-hunt --branch=${{ github.ref_name }}

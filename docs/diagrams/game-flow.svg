<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/></marker></defs>
<rect width="1536" height="1024" fill="#ffffff"/><rect x="600.0" y="16.0" width="200" height="36" rx="18" fill="#cbe8d1" stroke="#4a7c59" stroke-width="1.8"/><text x="700" y="39.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">Start</tspan></text><rect x="500.0" y="77.0" width="400" height="46" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="700" y="95.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">Player opens their personal link</tspan><tspan x="700" dy="20">Grants location  ·  camera + motion</tspan></text><rect x="474.0" y="144.0" width="452" height="52" rx="7" fill="#cfe7e2" stroke="#2f6f68" stroke-width="1.8"/><text x="700" y="165.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">START  —  the clock begins</tspan><tspan x="700" dy="20">Server draws a balanced route: 5 stops from 10</tspan></text><rect x="474.0" y="222.0" width="452" height="52" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="700" y="243.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">THE SCREENING  —  the clip plays on the AR screen</tspan><tspan x="700" dy="20">This is the clue: where on campus was it shot?</tspan></text><path d="M 700 301.0 L 850.0 336 L 700 371.0 L 550.0 336 Z" fill="#fbe6c0" stroke="#c98f2b" stroke-width="1.8"/><text x="700" y="331.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15202b"><tspan x="700" dy="0">Watch it</tspan><tspan x="700" dy="19">again?</tspan></text><rect x="474.0" y="398.0" width="452" height="52" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="700" y="419.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">SEARCH  —  walk, warmer / colder,</tspan><tspan x="700" dy="20">hold to ghost the frame over the live camera</tspan></text><path d="M 700 477.0 L 850.0 512 L 700 547.0 L 550.0 512 Z" fill="#fbe6c0" stroke="#c98f2b" stroke-width="1.8"/><text x="700" y="507.4" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15202b"><tspan x="700" dy="0">Inside the</tspan><tspan x="700" dy="19">geofence?</tspan></text><rect x="474.0" y="574.0" width="452" height="52" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="700" y="595.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">HOLD 20s  —  the screen assembles in front of you</tspan><tspan x="700" dy="20">frame  →  panel  →  picture</tspan></text><path d="M 700 652.0 L 868.0 690 L 700 728.0 L 532.0 690 Z" fill="#fbe6c0" stroke="#c98f2b" stroke-width="1.8"/><text x="700" y="685.55" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15202b"><tspan x="700" dy="0">Server validates</tspan><tspan x="700" dy="18">the arrival?</tspan></text><rect x="474.0" y="754.0" width="452" height="52" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="700" y="775.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">THE REVEAL  —  the held frame comes alive,</tspan><tspan x="700" dy="20">playing where it was filmed</tspan></text><rect x="490.0" y="826.0" width="420" height="40" rx="7" fill="#cfe7e2" stroke="#2f6f68" stroke-width="1.8"/><text x="700" y="850.9" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15202b"><tspan x="700" dy="0">Unlock the next rung of the reward ladder</tspan></text><path d="M 700 881.0 L 825.0 910 L 700 939.0 L 575.0 910 Z" fill="#fbe6c0" stroke="#c98f2b" stroke-width="1.8"/><text x="700" y="905.55" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15202b"><tspan x="700" dy="0">All five</tspan><tspan x="700" dy="18">found?</tspan></text><rect x="465.0" y="956.0" width="470" height="40" rx="20" fill="#cbe8d1" stroke="#4a7c59" stroke-width="1.8"/><text x="700" y="981.25" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15202b"><tspan x="700" dy="0">End  —  score vs par  ·  standings  ·  the wrap</tspan></text><path d="M 700 52.0 L 700 77.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 123.0 L 700 144.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 196.0 L 700 222.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 274.0 L 700 301.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 371.0 L 700 398.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 450.0 L 700 477.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 547.0 L 700 574.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 626.0 L 700 652.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 728.0 L 700 754.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 806.0 L 700 826.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 866.0 L 700 881.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 700 939.0 L 700 956.0" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><text x="714" y="388.55" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="714" dy="0">No</tspan></text><text x="714" y="564.55" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="714" dy="0">Yes</tspan></text><text x="714" y="744.55" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="714" dy="0">Yes</tspan></text><text x="714" y="956.55" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="714" dy="0">Yes</tspan></text><rect x="1002.0" y="305.0" width="300" height="62" rx="7" fill="#cfe7e2" stroke="#2f6f68" stroke-width="1.8"/><text x="1152" y="331.55" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15202b"><tspan x="1152" dy="0">Two viewings a level are free.</tspan><tspan x="1152" dy="18">Past that, +45s on the clock.</tspan></text><path d="M 850.0 336 L 1002 336" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><text x="865" y="328.55" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="865" dy="0">Yes</tspan></text><path d="M 1302 336 L 1402 336 L 1402 236 L 926 236" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><rect x="142.0" y="481.0" width="300" height="62" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="292" y="507.55" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#15202b"><tspan x="292" dy="0">Keep looking.</tspan><tspan x="292" dy="18">A hint is there — and it costs time.</tspan></text><path d="M 550.0 512 L 442 512" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><text x="535" y="504.55" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="535" dy="0">No</tspan></text><path d="M 292 481 L 292 410 L 474 410" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><rect x="142.0" y="653.0" width="300" height="74" rx="7" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.8"/><text x="292" y="676.875" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15202b"><tspan x="292" dy="0">Refused, and told why:</tspan><tspan x="292" dy="17.5">weak signal  ·  too fast  ·  wrong place</tspan><tspan x="292" dy="17.5">or an earlier scene still unfinished</tspan></text><path d="M 532.0 690 L 442 690" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><text x="520" y="682.55" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="520" dy="0">No</tspan></text><path d="M 142 690 L 116 690 L 116 438 L 474 438" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><path d="M 825.0 910 L 1492 910 L 1492 260 L 926 260" fill="none" stroke="#3a3a3a" stroke-width="1.9" marker-end="url(#a)"/><text x="840" y="902.55" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a3a3a"><tspan x="840" dy="0">No</tspan></text><text x="1482" y="604.375" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3a3a3a"><tspan x="1482" dy="0">next clue</tspan></text><rect x="48" y="44" width="252" height="112" rx="8" fill="#fbfcfd" stroke="#e2e8ed"/><rect x="62" y="61" width="20" height="18" rx="4" fill="#d6e6f7" stroke="#2f6390" stroke-width="1.6"/><text x="92" y="74.375" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#41525f"><tspan x="92" dy="0">On the phone</tspan></text><rect x="62" y="90" width="20" height="18" rx="4" fill="#cfe7e2" stroke="#2f6f68" stroke-width="1.6"/><text x="92" y="103.375" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#41525f"><tspan x="92" dy="0">Decided by the server</tspan></text><rect x="62" y="119" width="20" height="18" rx="4" fill="#fbe6c0" stroke="#c98f2b" stroke-width="1.6"/><text x="92" y="132.375" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#41525f"><tspan x="92" dy="0">Decision</tspan></text>
<text x="1508" y="1006" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8a9aa6">Campus Movie Hunt — one level of the loop, repeated five times</text>
</svg>